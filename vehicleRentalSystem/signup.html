<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Rental System - Sign Up</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-5">

    <div class="bg-white shadow-2xl rounded-2xl overflow-hidden w-full max-w-5xl flex">

        <!-- Left Side -->
        <div class="hidden md:flex md:w-1/2 bg-blue-600 items-center justify-center p-10">
            <div class="text-center text-white">
                <h1 class="text-4xl font-bold mb-4">
                    Vehicle Rental System
                </h1>

                <p class="text-lg">
                    Create your account and start renting vehicles.
                </p>

                <img
                    src="images/images.jpg" alt="Vehicle"
                    class="mt-8 rounded-xl shadow-lg"
                >
            </div>
        </div>

        <!-- Right Side Signup Form -->
        <div class="w-full md:w-1/2 p-10">

            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">
                    Create Account
                </h2>

                <p class="text-gray-500 mt-2">
                    Register for Vehicle Rental System
                </p>
            </div>

            <form>

                <!-- Full Name -->
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <!-- Phone -->
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        placeholder="Enter phone number"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block text-gray-700 font-medium mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Create password"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <!-- Confirm Password -->
                <div class="mb-5">
                    <label class="block text-gray-700 font-medium mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        placeholder="Confirm password"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                </div>

                <!-- Register Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-300 font-semibold"
                >
                    Sign Up
                </button>

                <!-- Login Link -->
                <p class="text-center text-gray-600 mt-5">
                    Already have an account?
                    <a href="login.html"
                        class="text-blue-600 font-semibold hover:underline">
                        Login
                    </a>
                </p>

            </form>

        </div>

    </div>

</body>
</html>
