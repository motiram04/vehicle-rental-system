<nav class="bg-white shadow-md px-8 py-4 flex justify-between items-center">

    <!-- Page Title -->

    <div>

        <h2 class="text-2xl font-bold text-gray-700">

            Vehicle Owner Dashboard

        </h2>

        <p class="text-gray-500 text-sm">

            Welcome back, {{ session.get('full_name','Owner') }}

        </p>

    </div>

    <!-- Right Section -->

    <div class="flex items-center space-x-6">

        <!-- Notification -->

        <button class="relative">

            <i class="fa-solid fa-bell text-2xl text-gray-600"></i>

            <span class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full px-2">

                3

            </span>

        </button>

        <!-- Profile -->

        <div class="flex items-center">

            {% if owner is defined and owner and owner.profile_picture %}

            <img src="{{ url_for('static',
             filename='uploads/profiles/' ~ owner.profile_picture) }}" alt="{{ owner.full_name }}" 
             class="w-12 h-12 rounded-full object-cover
               border-2 border-white shadow">

            {% else %}

            <div class="w-12 h-12 rounded-full
                bg-blue-100
                flex items-center justify-center">

                <i class="fa-solid fa-user text-blue-600 text-xl"></i>

            </div>

            {% endif %}

</nav>
