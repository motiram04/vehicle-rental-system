{% extends "admin/layout/base.html" %}

{% block title %}Edit User{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white shadow rounded-lg p-8">

    <h1 class="text-3xl font-bold mb-6">

        Edit User

    </h1>

    <form method="POST">

        <div class="mb-5">

            <label>Full Name</label>

            <input type="text" name="full_name" value="{{ user.full_name }}" class="w-full border rounded p-3">

        </div>

        <div class="mb-5">

            <label>Email</label>

            <input type="email" name="email" value="{{ user.email }}" class="w-full border rounded p-3">

        </div>

        <div class="mb-5">

            <label>Phone</label>

            <input type="text" name="phone" value="{{ user.phone }}" class="w-full border rounded p-3">

        </div>

        <div class="mb-5">

            <label>Role</label>

            <select name="role" class="w-full border rounded p-3">

                <option value="admin" {% if user.role=="admin" %}selected{% endif %}>
                    Admin
                </option>

                <option value="owner" {% if user.role=="owner" %}selected{% endif %}>
                    Owner
                </option>

                <option value="customer" {% if user.role=="customer" %}selected{% endif %}>
                    Customer
                </option>

            </select>

        </div>

        <div class="flex gap-3">

            <button class="bg-blue-600 text-white px-6 py-3 rounded">

                Update User

            </button>

            <a href="{{ url_for('admin.users') }}" class="bg-gray-600 text-white px-6 py-3 rounded">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
