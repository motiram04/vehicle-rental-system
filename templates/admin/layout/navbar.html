<nav class="bg-white shadow px-8 py-4 flex justify-between items-center">

    <h1 class="text-2xl font-bold">

        Admin Dashboard

    </h1>

    <!-- Admin Profile Header -->
<div class="flex items-center gap-4">

    <!-- Profile -->
    <a href="{{ url_for('admin.profile') }}"
       class="flex items-center gap-3 px-3 py-2 rounded-lg
              hover:bg-gray-100 transition duration-200">

        <!-- Profile Picture -->
        {% if current_admin and current_admin.profile_picture %}

            <img
                src="{{ url_for(
                    'static',
                    filename='uploads/profile/' ~ current_admin.profile_picture
                ) }}"
                alt="Profile Picture"
                class="w-10 h-10 rounded-full object-cover
                       border-2 border-blue-500"
            >

        {% else %}

            <img
                src="{{ url_for(
                    'static',
                    filename='images/download.jpg'
                ) }}"
                alt="Default Profile"
                class="w-10 h-10 rounded-full object-cover
                       border-2 border-gray-300"
            >

        {% endif %}

        <!-- Admin Information -->
        <div class="leading-tight">

            <p class="font-semibold text-gray-800">
                {{ current_admin.full_name if current_admin else 'System Administrator' }}
            </p>

            <p class="text-xs text-gray-500">
                {{ current_admin.role if current_admin else 'admin' }}
            </p>

        </div>

    </a>

</div>

</nav>
